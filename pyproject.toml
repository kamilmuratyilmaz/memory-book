[project]
name = "memory-book"
version = "0.1.0"
description = "AI-powered memory books: generate, edit, read and print from one document model"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kamil Murat Yılmaz", email = "74376625+kamilmuratyilmaz@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ag-ui-protocol>=1.0.0",
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "litellm==1.104.0",
    "mlflow-tracing>=3.16.1",
    "opencv-python-headless==5.0.0.93",
    "pillow>=12.3.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
memory-book = "memory_book:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonpatch>=1.33",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:pydantic._internal._generate_schema"]  # raised by litellm's own types

[tool.ruff]
line-length = 120
